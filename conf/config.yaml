# BiEAR: dual-controller training configuration
# See docs/configuration.md for variants and paper/code differences.
# Values are preserved from the original research configuration.

# Local paths
ROOT: "/media/mengh/SharedData/hanyu/DeepEar/anechoic_dataset"
RUNS_ROOT: "runs_deepear_exps"
COMMENTS: ""

# Inputs and model
Active: true                 # true: waveforms; false: precomputed features
USE_CC: true
Controller_Mode: "dual"      # Use train_biear.py for this variant
FIXED_FRONTEND_Q: false      # true: hold Q at its baseline value
FREEZE_Q_CONTROLLER_ONLY: false  # Frozen weights can still produce varying Q
ALPHA: 0

# Q modulation: Q = Q0 * (1 + deltaQ_vec * delta) in relative mode
DELTAQ_MODE: "relative"
DELTAQ_BASE: 1.0
DELTAQ_LOW_FACTOR: 0.3
DELTAQ_HIGH_FACTOR: 5

# Optimisation
BATCH_SIZE: 64
EPOCHS: 150
LR_FB: 5.0e-5
LR_BACKEND: 1.0e-4
WEIGHT_DECAY: 1.0e-5
GRAD_CLIP_NORM: 3.0
REG_Q_W: 1.0e-3
REG_SMOOTH_W: 1.0e-3

# Task loss weights
LOSS_WEIGHT_SOUND: 0.2
LOSS_WEIGHT_AOA: 0.45
LOSS_WEIGHT_DIST: 0.35

# Logging and checkpoints
HIST_EVERY: 50
MAX_PARAM_LOG: 200
PRINT_EVERY: 20
SAVE_EVERY_EPOCH: true
